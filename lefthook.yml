# Git-хуки монорепы. Хуки ставятся автоматически (postinstall lefthook +
# скрипт "prepare"). Пропустить разово: LEFTHOOK=0 git commit ...
#
# pre-commit (последовательно): oxfmt форматирует staged-файлы, затем oxlint
# правит их — порядок важен, оба меняют файлы, параллельный запуск = гонка.
# Каждый шаг с stage_fixed дозастейдживает свои правки.
# pre-push — проверка формата (oxfmt --check) + полный прогон через turbo:
# lint + typecheck (tsc) + тесты.

pre-commit:
  parallel: false
  jobs:
    - name: format
      glob: '*.{ts,tsx,css,json}'
      # --no-error-on-unmatched-pattern: если единственный staged-файл под маской
      # отсеян ignorePatterns из .oxfmtrc.json (напр. .claude/settings.json), oxfmt
      # получает 0 целей. Без флага это exit 2 и падение хука; с флагом — тихий 0.
      # Игноры остаются единственным источником правды в .oxfmtrc.json.
      run: pnpm exec oxfmt --write --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: lint-client
      root: apps/client/
      glob: '*.{ts,tsx}'
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true
    - name: lint-server
      root: apps/server/
      glob: '*.ts'
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: format-check
      run: pnpm exec oxfmt --check .
    - name: verify
      run: pnpm turbo run lint typecheck test
